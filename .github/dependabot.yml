version: 2
updates:
  # The Bun workspace: the library and the examples share one bun.lock at the root. spikes/r2 is a throwaway spike
  # with its own lockfile and is left out on purpose.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # Types must match the minimum supported Node.js (engines.node: >=24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The workspace pins drizzle-orm to the release the adapter is tested against; CI type-checks the 0.45 line
      # separately (drizzle-0-45). Moving it is a deliberate change with a decision entry.
      - dependency-name: "drizzle-orm"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      github-actions:
        patterns: ["*"]
