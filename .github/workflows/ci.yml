name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Read-only token for every job; a job that needs more must say so itself.
permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Every other run has its own group (the run ID), so
# nothing is cancelled or dropped as "pending", and the live R2 job is never killed between writing and deleting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a full commit SHA (a moved tag would run new code with this repository's credentials).
# Refresh with: gh api repos/<owner>/<repo>/git/ref/tags/<tag>, and dereference annotated tags.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run package:check

  rustfs:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: scripts/test-rustfs.sh

  wrangler:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: scripts/test-wrangler.sh

  # Nightly and manual only, and only once the owner has created the test bucket's secrets and set the repository
  # variable CLOUDROP_LIVE_R2_ENABLED to "true". Once enabled, a missing secret fails the job loudly.
  # Only main runs it, so a manual dispatch of another branch never hands that branch's code the live secrets.
  # Recommended owner setting (not created here): keep the four secrets in a GitHub Environment limited to main and
  # add `environment: <name>` to this job.
  live-r2:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.CLOUDROP_LIVE_R2_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The credentials exist only in this step's environment. The script redacts them from everything Vitest prints.
      - name: Live R2 contract
        env:
          CLOUDROP_R2_ACCOUNT_ID: ${{ secrets.CLOUDROP_R2_ACCOUNT_ID }}
          CLOUDROP_R2_BUCKET: ${{ secrets.CLOUDROP_R2_BUCKET }}
          CLOUDROP_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDROP_R2_ACCESS_KEY_ID }}
          CLOUDROP_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDROP_R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in CLOUDROP_R2_ACCOUNT_ID CLOUDROP_R2_BUCKET CLOUDROP_R2_ACCESS_KEY_ID CLOUDROP_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "CLOUDROP_LIVE_R2_ENABLED is true but these repository secrets are empty:$missing. Add them, or set the variable to false." >&2
            exit 1
          fi
          bun run test:live
