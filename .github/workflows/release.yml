name: release

# Publishes packages/cloudrop to npm when a tag v<version> is pushed. Procedure and one-time setup: docs/releasing.md.
# Authentication is npm trusted publishing (OIDC): npm trusts this file, in this repository, in the environment `npm`.
# No npm token exists anywhere; the publish job's short-lived OIDC credential is exchanged by the npm CLI itself.
on:
  push:
    tags: ["v*"]

permissions: {}

# Two pushed tags never publish at the same time, and a running release is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

# Every action is pinned to a full commit SHA, as in ci.yml. Refresh with:
# gh api repos/<owner>/<repo>/git/ref/tags/<tag>, and dereference annotated tags.
jobs:
  # Everything that runs this repository's code and its dependencies happens here, without the OIDC permission. The
  # output is the tarball that `bun run verify` checked, handed to the publish job unchanged.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The tag must name the version in package.json; a prerelease (1.0.0-beta.1) goes to `next`, so `npm i cloudrop`
      # keeps installing the last stable release.
      - name: Check the tag against package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./packages/cloudrop/package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in packages/cloudrop/package.json. Delete the tag, set the version to ${TAG#v} in a chore(release) commit (or tag v$version instead) and push the tag again."
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >>"$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cd packages/cloudrop
          bun pm pack --destination "$RUNNER_TEMP/package" --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC permission and runs no code from the repository or its dependencies: no checkout, no install.
  # The `npm` environment is where the owner's approval gate lives; its name is part of the trusted publisher.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; pinned, so a new npm release never changes how a release publishes.
      - run: npm install -g npm@11.21.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # npm adds a provenance statement on its own when the repository is public; a private repository publishes
      # without one. Forcing it (--provenance) would fail every publish while the repository is private.
      - name: Publish ${{ needs.build.outputs.version }} under ${{ needs.build.outputs.dist-tag }}
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --access public --tag "$DIST_TAG"
