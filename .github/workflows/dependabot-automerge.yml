name: dependabot-automerge

# Turns on auto-merge for Dependabot's patch and minor updates of development dependencies. Auto-merge then waits for
# the branch protection's required checks; without them nothing is merged here (see the guard below).
# This privileged event reads metadata only. Never check out or run the pull request's code here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge for development updates
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned to a full commit SHA, as in ci.yml.
      - name: Read dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      # Runtime dependencies, majors, GitHub Actions, and the libraries cloudrop's adapters and hooks target (Drizzle,
      # Prisma, React) need a person. `gh pr merge --auto` merges at once when nothing is required, so it runs only
      # while the pull request is BLOCKED, that is while required checks are still pending; otherwise the pull request
      # is left for review.
      - name: Enable auto-merge
        if: >-
          (steps.metadata.outputs.package-ecosystem == 'bun' ||
           steps.metadata.outputs.package-ecosystem == 'npm_and_yarn') &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.dependency-names, 'drizzle') &&
          !contains(steps.metadata.outputs.dependency-names, 'prisma') &&
          !contains(steps.metadata.outputs.dependency-names, 'react')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
          if [ "$state" != "BLOCKED" ]; then
            echo "Merge state is $state, not BLOCKED by pending required checks; leaving the pull request for review."
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
